[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-wam"
version = "0.1.0"
description = "Compact latent world/action models and robot demonstration retargeting"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.0", "torch==2.7.1", "scipy==1.15.3"]

[project.optional-dependencies]
reproduce = ["diffusers==0.36.0", "transformers==4.57.6", "huggingface-hub==0.36.2", "safetensors==0.8.0", "einops==0.8.2", "Pillow==11.3.0", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "matplotlib==3.10.3", "accelerate==1.10.1"]
train = ["bitsandbytes==0.48.1", "wandb==0.22.3"]
geometry = ["trimesh==4.5.1", "pyrender==0.1.45", "Pillow==11.3.0", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "opencv-python-headless==4.10.0.84", "h5py==3.12.1"]

[project.scripts]
tiny-wam = "tinywam.tasks.manipulation.prediction.cli:main"
tiny-wam-retarget = "tinywam.retargeting.cli:main"
tiny-wam-preview = "tinywam.preview:main"

[tool.setuptools.packages.find]
where = ["src"]
